[lab:auth]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
EXTRACT-host = ^\S+ \S+ (?<host>\S+) sshd\[\d+\]:
EXTRACT-failed = Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+)
EXTRACT-accepted = Accepted password for (?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+)
EVAL-action = case(match(_raw, "Failed password"), "failure", match(_raw, "Accepted password"), "success", true(), "other")
