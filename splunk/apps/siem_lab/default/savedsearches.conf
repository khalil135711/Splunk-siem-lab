[Alert - SSH Brute Force]
search = index=lab_auth sourcetype=lab:auth action=failure | stats count AS failures dc(user) AS users BY src_ip | where failures >= 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
description = Mindestens 5 fehlgeschlagene SSH-Anmeldungen von derselben IP innerhalb von 5 Minuten (ISO 27001 Anhang A 8.16 Ueberwachung)

[Alert - Erfolgreiche Anmeldung nach Fehlversuchen]
search = index=lab_auth sourcetype=lab:auth | stats count(eval(action="failure")) AS failures count(eval(action="success")) AS successes latest(_time) AS last_seen BY src_ip | where failures >= 3 AND successes >= 1 | convert ctime(last_seen)
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
description = Moegliche kompromittierte Anmeldung: Erfolg nach mindestens 3 Fehlversuchen von derselben IP
